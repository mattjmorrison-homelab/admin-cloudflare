name: OpenTofu

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

env:
  VAULT_ADDR: http://k8s-openbao.openbao.svc:8200
  VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}

jobs:
  check:
    if: github.event.action != 'closed'
    runs-on: k8s-amd64
    # OIDC (todo #17): this job authenticates to OpenBao via GitHub's own
    # OIDC token instead of the Kubernetes-auth JWT the apply job still
    # uses -- id-token: write is what lets this job request one.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8
        with:
          tofu_version: "1.12.0"
          tofu_wrapper: false
      - name: Format check
        run: tofu fmt -check -recursive
      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
      - run: tflint --init
      - run: tflint
      # OIDC (todo #17): fetches AWS state creds + Cloudflare API token/
      # account id via GitHub OIDC + OpenBao's jwt auth method. Two logins,
      # same as the two Kubernetes-auth logins this replaces (one per
      # policy) -- same GitHub OIDC token reused for both, only the `role`
      # param differs per login. Inline for now, matching the admin-github
      # pilot's own inline approach.
      - name: Fetch credentials via GitHub OIDC + OpenBao jwt auth
        env:
          VAULT_ADDR: http://k8s-openbao.openbao.svc:8200
        run: |
          GH_OIDC_TOKEN=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=openbao" | jq -r '.value')

          vault_login() {
            curl -sf -X POST "$VAULT_ADDR/v1/auth/jwt/login" \
              -d "$(jq -nc --arg jwt "$GH_OIDC_TOKEN" --arg role "$1" '{jwt: $jwt, role: $role}')" \
              | jq -r '.auth.client_token'
          }
          fetch_secret() {
            curl -sf -H "X-Vault-Token: $1" "$VAULT_ADDR/v1/kv/data/$2" | jq -r '.data.data.value'
          }

          TOFU_STATE_TOKEN=$(vault_login admin-cloudflare-tofu-state-oidc)
          ACCESS_KEY_ID=$(fetch_secret "$TOFU_STATE_TOKEN" homelab/service/k8s-garage/admin-cloudflare/tofu-state-access-key-id)
          SECRET_ACCESS_KEY=$(fetch_secret "$TOFU_STATE_TOKEN" homelab/service/k8s-garage/admin-cloudflare/tofu-state-secret-access-key)

          CLOUDFLARE_TOKEN=$(vault_login admin-cloudflare-oidc)
          CLOUDFLARE_API_TOKEN=$(fetch_secret "$CLOUDFLARE_TOKEN" homelab/admin-cloudflare/cloudflare-api-token)
          CF_ACCOUNT_ID=$(fetch_secret "$CLOUDFLARE_TOKEN" homelab/admin-cloudflare/cf-account-id)

          echo "::add-mask::$ACCESS_KEY_ID"
          echo "::add-mask::$SECRET_ACCESS_KEY"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          echo "::add-mask::$CF_ACCOUNT_ID"
          echo "AWS_ACCESS_KEY_ID=$ACCESS_KEY_ID" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$SECRET_ACCESS_KEY" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN" >> "$GITHUB_ENV"
          echo "TF_VAR_cf_account_id=$CF_ACCOUNT_ID" >> "$GITHUB_ENV"
      - run: tofu init
      - run: tofu plan -out=tfplan
      - uses: mattjmorrison-homelab/actions-tofu/upload-plan@c4253df5832781cf10d3b5dda78c135e6eed2a6b
        with:
          key: plans/${{ github.repository }}/${{ github.event.pull_request.head.sha }}/tfplan
          bucket: admin-cloudflare-tofu-state

  apply:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: k8s-amd64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - uses: mattjmorrison-homelab/actions-tofu/fetch-credentials@ee8759dc24664be5d19aef68d09032e7eb08169e # main
        with:
          role: admin-cloudflare-tofu-state
          kv-prefix: service/k8s-garage/admin-cloudflare
      - uses: mattjmorrison-homelab/actions-openbao@a9a15ee54f4b6a08b17ddd55df99d5109cfb5748 # main
        with:
          role: admin-cloudflare
          kv-path: homelab/admin-cloudflare/cloudflare-api-token
          output-name: CLOUDFLARE_API_TOKEN
      - uses: mattjmorrison-homelab/actions-openbao@a9a15ee54f4b6a08b17ddd55df99d5109cfb5748 # main
        with:
          role: admin-cloudflare
          kv-path: homelab/admin-cloudflare/cf-account-id
          output-name: TF_VAR_cf_account_id
      - uses: mattjmorrison-homelab/actions-tofu/download-plan@c4253df5832781cf10d3b5dda78c135e6eed2a6b
        with:
          key: plans/${{ github.repository }}/${{ github.event.pull_request.head.sha }}/tfplan
          bucket: admin-cloudflare-tofu-state
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8
        with:
          tofu_version: "1.12.0"
          tofu_wrapper: false
      - run: tofu init
      - run: tofu apply -auto-approve tfplan
